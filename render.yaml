# Render Infrastructure Blueprint for Pixovid
# Deploy by connecting repo to Render -> Blueprints -> New Blueprint Instance
version: "1"

services:
  # 1. Express Backend Web Service
  - type: web
    name: pixovid-backend
    runtime: docker
    dockerfilePath: apps/backend/Dockerfile
    dockerContext: .
    region: singapore # or oregon, frankfurt, etc.
    plan: free # or starter
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "4000"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pixovid-db
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BACKEND_URL
        sync: false # Set to https://pixovid-backend.onrender.com in dashboard
      - key: FRONTEND_URL
        sync: false # Set to https://pixovid-frontend.onrender.com in dashboard
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_THUMBNAIL_MODEL
        value: google/gemini-3.1-flash-image
      - key: OPENROUTER_THUMBNAIL_FALLBACK_MODELS
        value: bytedance-seed/seedream-4.5,black-forest-labs/flux.2-klein-4b
      - key: SWAP_PROVIDER
        value: flux
      - key: OPENROUTER_SWAP_MODEL
        value: black-forest-labs/flux.2-klein-4b
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPERADMIN_EMAILS
        sync: false
      - key: MINIO_ENDPOINT
        sync: false # e.g. f5577d3628a5dfc0f500e08adc8588cb.r2.cloudflarestorage.com
      - key: MINIO_FRONTEND_ENDPOINT
        sync: false # e.g. pub-2e8083da687e4fe0af8225bbbdb43c1f.r2.dev
      - key: MINIO_PORT
        value: "443"
      - key: MINIO_USE_SSL
        value: "true"
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: CREDITS_PER_IMAGE
        value: "6"
      - key: CREDITS_PER_VIDEO
        value: "60"
      - key: CREDITS_PER_TEMPLATE_RENDER
        value: "1000"
      - key: USD_INR_RATE
        value: "86"

  # 2. Vite Frontend Web Service (Nginx)
  - type: web
    name: pixovid-frontend
    runtime: docker
    dockerfilePath: apps/frontend/Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: pixovid-backend
          property: url

databases:
  # Managed PostgreSQL Database
  - name: pixovid-db
    databaseName: video_arena
    user: postgres
    region: singapore
    plan: free
